<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="台灣前二十大企業產業佔比｜2026-10-20"><rect width="1100" height="400" fill="white"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#243b53">台灣前二十大企業產業佔比｜2026-10-20</text><text x="30" y="78" font-family="sans-serif" font-size="13" fill="#243b53">佔比以各版原始名單重新計算；名單變動亦可能影響差異</text><text x="35" y="118" font-family="sans-serif" font-size="14" fill="#243b53">半導體</text><text x="350" y="118" font-family="sans-serif" font-size="13" fill="#243b53">75.73% → 77.12%（1.39 百分點）</text><rect x="835" y="104" height="16" width="231.36" fill="#4c83b7"/><text x="35" y="161" font-family="sans-serif" font-size="14" fill="#243b53">電子與硬體</text><text x="350" y="161" font-family="sans-serif" font-size="13" fill="#243b53">12.99% → 12.79%（-0.20 百分點）</text><rect x="835" y="147" height="16" width="38.37" fill="#e18b44"/><text x="35" y="204" font-family="sans-serif" font-size="14" fill="#243b53">金融</text><text x="350" y="204" font-family="sans-serif" font-size="13" fill="#243b53">5.92% → 5.79%（-0.13 百分點）</text><rect x="835" y="190" height="16" width="17.38" fill="#419878"/><text x="35" y="247" font-family="sans-serif" font-size="14" fill="#243b53">原物料與能源</text><text x="350" y="247" font-family="sans-serif" font-size="13" fill="#243b53">3.32% → 3.20%（-0.12 百分點）</text><rect x="835" y="233" height="16" width="9.61" fill="#996db1"/><text x="35" y="290" font-family="sans-serif" font-size="14" fill="#243b53">電信</text><text x="350" y="290" font-family="sans-serif" font-size="13" fill="#243b53">1.10% → 1.09%（-0.01 百分點）</text><rect x="835" y="276" height="16" width="3.28" fill="#c46b73"/></svg>