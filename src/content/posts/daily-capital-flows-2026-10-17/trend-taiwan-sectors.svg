<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 418" role="img" aria-label="台灣前二十大企業產業佔比｜2026-10-17"><rect width="1100" height="418" fill="white"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#243b53">台灣前二十大企業產業佔比｜2026-10-17</text><text x="30" y="78" font-family="sans-serif" font-size="13" fill="#243b53">佔比以各版原始名單重新計算；名單變動亦可能影響差異</text><text x="35" y="118" font-family="sans-serif" font-size="14" fill="#243b53">半導體</text><text x="350" y="118" font-family="sans-serif" font-size="13" fill="#243b53">77.15% → 75.73%（-1.43 百分點）</text><rect x="835" y="104" height="16" width="227.18" fill="#4c83b7"/><text x="35" y="161" font-family="sans-serif" font-size="14" fill="#243b53">電子與硬體</text><text x="350" y="161" font-family="sans-serif" font-size="13" fill="#243b53">12.76% → 12.99%（0.24 百分點）</text><rect x="835" y="147" height="16" width="38.98" fill="#e18b44"/><text x="35" y="204" font-family="sans-serif" font-size="14" fill="#243b53">金融</text><text x="350" y="204" font-family="sans-serif" font-size="13" fill="#243b53">5.76% → 5.92%（0.16 百分點）</text><rect x="835" y="190" height="16" width="17.77" fill="#419878"/><text x="35" y="247" font-family="sans-serif" font-size="14" fill="#243b53">原物料與能源</text><text x="350" y="247" font-family="sans-serif" font-size="13" fill="#243b53">3.24% → 3.32%（0.08 百分點）</text><rect x="835" y="233" height="16" width="9.96" fill="#996db1"/><text x="35" y="290" font-family="sans-serif" font-size="14" fill="#243b53">電信</text><text x="350" y="290" font-family="sans-serif" font-size="13" fill="#243b53">1.09% → 1.10%（0.02 百分點）</text><rect x="835" y="276" height="16" width="3.31" fill="#c46b73"/><text x="35" y="333" font-family="sans-serif" font-size="14" fill="#243b53">其他／未分類</text><text x="350" y="333" font-family="sans-serif" font-size="13" fill="#243b53">0.00% → 0.93%（0.93 百分點）</text><rect x="835" y="319" height="16" width="2.79" fill="#828c41"/></svg>